<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BBBFC4"/></marker></defs><rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/><text x="40.0" y="52.0" font-size="26" font-weight="700" fill="#1F2329" text-anchor="start" opacity="1.0">评测能力成熟度四层金字塔</text><text x="40.0" y="80.0" font-size="13" font-weight="400" fill="#646A73" text-anchor="start" opacity="1.0">自下而上收敛：底座是数据与工具，塔尖是决策结论；每层给出可验收的判断标准</text><polygon points="390.0,148.0 470.0,148.0 529.0,252.0 331.0,252.0" fill="#FEF1CE" stroke="#FF8800" stroke-width="1.6"/><text x="430.0" y="198.0" font-size="15" font-weight="700" fill="#1F2329" text-anchor="middle" opacity="1.0">决策层</text><text x="430.0" y="222.0" font-size="11.5" font-weight="400" fill="#646A73" text-anchor="middle" opacity="1.0">用评测结论做发布决策</text><text x="313.0" y="206.0" font-size="12" font-weight="600" fill="#8F959E" text-anchor="end" opacity="1.0">L4</text><polygon points="317.8,264.0 542.2,264.0 601.6,368.0 258.4,368.0" fill="#F0E9FF" stroke="#7F3BF5" stroke-width="1.6"/><text x="430.0" y="314.0" font-size="15" font-weight="700" fill="#1F2329" text-anchor="middle" opacity="1.0">洞察层</text><text x="430.0" y="338.0" font-size="11.5" font-weight="400" fill="#646A73" text-anchor="middle" opacity="1.0">归因到能力维度，给出改进项</text><text x="240.4" y="322.0" font-size="12" font-weight="600" fill="#8F959E" text-anchor="end" opacity="1.0">L3</text><polygon points="245.2,380.0 614.8,380.0 674.2,484.0 185.8,484.0" fill="#DBF5F0" stroke="#14B8A6" stroke-width="1.6"/><text x="430.0" y="430.0" font-size="15" font-weight="700" fill="#1F2329" text-anchor="middle" opacity="1.0">执行层</text><text x="430.0" y="454.0" font-size="11.5" font-weight="400" fill="#646A73" text-anchor="middle" opacity="1.0">稳定跑完批次，产出可复现报告</text><text x="167.8" y="438.0" font-size="12" font-weight="600" fill="#8F959E" text-anchor="end" opacity="1.0">L2</text><polygon points="172.6,496.0 687.4,496.0 746.8,600.0 113.2,600.0" fill="#F0F4FC" stroke="#3370FF" stroke-width="1.6"/><text x="430.0" y="546.0" font-size="15" font-weight="700" fill="#1F2329" text-anchor="middle" opacity="1.0">数据层</text><text x="430.0" y="570.0" font-size="11.5" font-weight="400" fill="#646A73" text-anchor="middle" opacity="1.0">用例、轨迹、判分结果可追溯</text><text x="95.2" y="554.0" font-size="12" font-weight="600" fill="#8F959E" text-anchor="end" opacity="1.0">L1</text><rect x="800.0" y="148.0" width="396.0" height="300.0" rx="12" fill="#FBFCFD" stroke="#E5E6EB" stroke-width="1" opacity="1.0"/><text x="822.0" y="178.0" font-size="13" font-weight="700" fill="#1F2329" text-anchor="start" opacity="1.0">各层验收信号</text><rect x="822.0" y="198.0" width="69.8" height="22.0" rx="11" fill="#FEF1CE" stroke="#FF8800" stroke-width="1" opacity="1.0"/><text x="856.9" y="212.8" font-size="10.5" font-weight="600" fill="#9A5B00" text-anchor="middle" opacity="1.0">L4 决策层</text><text x="822.0" y="236.0" font-size="11" font-weight="400" fill="#646A73" text-anchor="start" opacity="1.0">发布 / 不发布结论有一票否决位</text><rect x="822.0" y="258.0" width="69.8" height="22.0" rx="11" fill="#F0E9FF" stroke="#7F3BF5" stroke-width="1" opacity="1.0"/><text x="856.9" y="272.8" font-size="10.5" font-weight="600" fill="#5B21B6" text-anchor="middle" opacity="1.0">L3 洞察层</text><text x="822.0" y="296.0" font-size="11" font-weight="400" fill="#646A73" text-anchor="start" opacity="1.0">每个失败项都能定位到维度与用例</text><rect x="822.0" y="318.0" width="69.8" height="22.0" rx="11" fill="#DBF5F0" stroke="#14B8A6" stroke-width="1" opacity="1.0"/><text x="856.9" y="332.8" font-size="10.5" font-weight="600" fill="#0F766E" text-anchor="middle" opacity="1.0">L2 执行层</text><text x="822.0" y="356.0" font-size="11" font-weight="400" fill="#646A73" text-anchor="start" opacity="1.0">同批次重跑分数差异 &lt; 1 分</text><rect x="822.0" y="378.0" width="69.8" height="22.0" rx="11" fill="#F0F4FC" stroke="#3370FF" stroke-width="1" opacity="1.0"/><text x="856.9" y="392.8" font-size="10.5" font-weight="600" fill="#1F4BD8" text-anchor="middle" opacity="1.0">L1 数据层</text><text x="822.0" y="416.0" font-size="11" font-weight="400" fill="#646A73" text-anchor="start" opacity="1.0">任一分数可回放到原始轨迹</text><text x="40.0" y="660.0" font-size="11" font-weight="400" fill="#8F959E" text-anchor="start" opacity="1.0">越靠下越强调可复现，越靠上越强调可解释；不要跳级建设</text></svg>