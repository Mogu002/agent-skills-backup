<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>核心产品连接四类生态角色，云伙伴为二级节点</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 400px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>核心产品连接四类生态角色，云伙伴为二级节点</h1><p>关系网络图：force 布局，初始即清晰；节点大小表达影响力</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var option = {
        animation: false,
        tooltip: {},
        legend: { bottom: 2, itemWidth: 10, itemHeight: 10, textStyle: { color: "#4b5563", fontSize: 12 } },
        series: [{
          type: "graph", layout: "force", roam: false, draggable: true,
          force: { repulsion: 380, edgeLength: [80, 150], gravity: 0.06 },
          label: { show: true, color: "#374151", fontSize: 11, position: "bottom" },
          categories: [{ name: "核心" }, { name: "客户" }, { name: "伙伴" }],
          lineStyle: { color: "#cbd5e1", width: 1.5, curveness: .08 },
          data: [
            { name: "核心产品", symbolSize: 62, category: 0, itemStyle: { color: C.blue } },
            { name: "企业客户", symbolSize: 44, category: 1, itemStyle: { color: C.teal } },
            { name: "开发者", symbolSize: 40, category: 1, itemStyle: { color: C.teal } },
            { name: "云伙伴", symbolSize: 42, category: 2, itemStyle: { color: C.amber } },
            { name: "渠道商", symbolSize: 32, category: 2, itemStyle: { color: C.amber } }
          ],
          links: [
            { source: "核心产品", target: "企业客户" },
            { source: "核心产品", target: "开发者" },
            { source: "核心产品", target: "云伙伴" },
            { source: "云伙伴", target: "渠道商" }
          ]
        }]
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
