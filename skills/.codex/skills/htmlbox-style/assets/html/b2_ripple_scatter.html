<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重点客户 D 是唯一规模与增速双高样本</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 400px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>重点客户 D 是唯一规模与增速双高样本</h1><p>涟漪气泡散点：普通样本静态散点，重点样本用 effectScatter 高亮，气泡大小映射收入</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var normal = [[50, 18, 30, "客户 A"], [120, 32, 80, "客户 B"], [90, 12, 45, "客户 C"], [210, 9, 60, "客户 E"], [70, 24, 26, "客户 F"], [140, 15, 95, "客户 G"]];
      var highlights = [[160, 42, 120, "重点客户 D"]];
      var option = {
        animation: false,
        tooltip: { formatter: function (p) { return p.data[3] + "<br/>规模: " + p.data[0] + "<br/>增速: " + p.data[1] + "%<br/>收入: " + p.data[2] + " 万元"; } },
        grid: { left: 62, right: 66, top: 34, bottom: 48 },
        xAxis: { type: "value", name: "客户规模", nameTextStyle: { color: "#6b7280" }, axisLabel: { color: "#4b5563" }, splitLine: { lineStyle: { color: "#eef1f5" } } },
        yAxis: { type: "value", name: "增速%", nameTextStyle: { color: "#6b7280" }, axisLabel: { color: "#4b5563", formatter: "{value}%" }, splitLine: { lineStyle: { color: "#eef1f5" } } },
        series: [
          { type: "scatter", symbolSize: function (d) { return Math.max(10, Math.sqrt(d[2]) * 2.2); }, data: normal, itemStyle: { color: "#93c5fd", opacity: .85 } },
          { type: "effectScatter", symbolSize: function (d) { return Math.max(16, Math.sqrt(d[2]) * 2.2); }, rippleEffect: { scale: 2.6, brushType: "stroke" }, data: highlights, itemStyle: { color: C.amber }, label: { show: true, formatter: function (p) { return p.data[3]; }, position: "right", color: "#b45309", fontWeight: 600 } }
        ]
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
