<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自然流量占比下降 11pct，投放与合作补位</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 400px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>自然流量占比下降 11pct，投放与合作补位</h1><p>百分比堆叠柱状：每季度合计 100%，tooltip 同步展示百分比口径</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var option = {
        animation: false,
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, valueFormatter: function (v) { return v + "%"; } },
        legend: { top: 4, itemWidth: 12, itemHeight: 8, textStyle: { color: "#4b5563", fontSize: 12 } },
        grid: { left: 58, right: 26, top: 58, bottom: 44 },
        xAxis: { type: "category", data: ["Q1", "Q2", "Q3", "Q4"], axisLabel: { color: "#4b5563" } },
        yAxis: { type: "value", max: 100, name: "%", nameTextStyle: { color: "#6b7280" }, axisLabel: { color: "#4b5563", formatter: "{value}%" }, splitLine: { lineStyle: { color: "#eef1f5" } } },
        series: [
          { name: "自然流量", type: "bar", stack: "total", barWidth: 40, data: [45, 42, 38, 34], itemStyle: { color: C.blue }, label: { show: true, formatter: "{c}%", color: "#ffffff", fontSize: 11 } },
          { name: "投放", type: "bar", stack: "total", data: [30, 32, 35, 38], itemStyle: { color: C.teal }, label: { show: true, formatter: "{c}%", color: "#083344", fontSize: 11, fontWeight: 600 } },
          { name: "合作", type: "bar", stack: "total", data: [25, 26, 27, 28], itemStyle: { color: C.amber, borderRadius: [3, 3, 0, 0] }, label: { show: true, formatter: "{c}%", color: "#7c2d12", fontSize: 11, fontWeight: 600 } }
        ]
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
