<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas 粒子网络：实时自绘的依赖关系</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #111827; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 12px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #st { min-height: 18px; font-size: 12px; color: #9ca3af; text-align: center; padding-top: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>Canvas 粒子网络：实时自绘的依赖关系</h1><p>结构：标题说明 + 自适应主体（静态 SVG / Canvas，无外部脚本依赖）+ 状态节点 #st</p></div>

  <canvas id="cv" width="820" height="360" style="width:100%;height:auto;display:block;border-radius:10px;background:#0b1220"></canvas>
  <script>
  (function () {
    var cv = document.getElementById("cv");
    var ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height;
    var nodes = [];
    for (var i = 0; i < 46; i++) {
      nodes.push({ x: (i * 137.5) % W, y: (i * 89.3) % H, vx: ((i % 5) - 2) * 0.22, vy: (((i * 3) % 5) - 2) * 0.18, r: 2 + (i % 3) });
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < nodes.length; i++) {
        var a = nodes[i];
        for (var j = i + 1; j < nodes.length; j++) {
          var b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 130) {
            ctx.strokeStyle = "rgba(96,165,250," + (0.30 * (1 - d / 130)).toFixed(3) + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      for (var k = 0; k < nodes.length; k++) {
        var n = nodes[k];
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = k % 7 === 0 ? "rgba(245,158,11,.95)" : "rgba(147,197,253,.92)";
        ctx.fill();
        n.x += n.vx; n.y += n.vy;
        if (n.x < 6 || n.x > W - 6) n.vx *= -1;
        if (n.y < 6 || n.y > H - 6) n.vy *= -1;
      }
    }
    draw();
    requestAnimationFrame(function loop() { draw(); requestAnimationFrame(loop); });
  })();
  </script>

  <div id="st" role="status"></div>
</div>
</body>
</html>
