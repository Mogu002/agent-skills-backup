<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渠道曝光排名：2026 年 B 渠道完成反超</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 330px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>渠道曝光排名：2026 年 B 渠道完成反超</h1><p>柱状竞赛 Bar Race：文档内固定呈现末年 2026 的排名（静态截图稳定，逐帧动画不在文档内播放）</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var frames = [
        { year: "2024", data: [["A 渠道", 120], ["B 渠道", 98], ["C 渠道", 76], ["D 渠道", 54]] },
        { year: "2025", data: [["A 渠道", 142], ["B 渠道", 131], ["C 渠道", 88], ["D 渠道", 61]] },
        { year: "2026", data: [["B 渠道", 176], ["A 渠道", 158], ["C 渠道", 120], ["D 渠道", 73]] }
      ];
      var frame = frames[2];
      var rows = frame.data.slice().sort(function (a, b) { return a[1] - b[1]; });
      var option = {
        animation: false,
        title: { text: "渠道曝光排名 " + frame.year, left: "center", top: 2, textStyle: { fontSize: 14, fontWeight: 600, color: "#374151" } },
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, valueFormatter: function (v) { return v + " 万次"; } },
        grid: { left: 92, right: 62, top: 46, bottom: 28 },
        xAxis: { type: "value", max: 200, axisLabel: { color: "#4b5563" }, splitLine: { lineStyle: { color: "#eef1f5" } } },
        yAxis: { type: "category", data: rows.map(function (d) { return d[0]; }), axisLabel: { color: "#374151", fontWeight: 500 }, axisTick: { show: false }, axisLine: { show: false } },
        series: [{
          type: "bar", barWidth: 20, data: rows.map(function (d) { return d[1]; }),
          itemStyle: { color: C.blue, borderRadius: [0, 4, 4, 0] },
          label: { show: true, position: "right", color: "#374151", fontWeight: 600, formatter: "{c} 万" }
        }]
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
