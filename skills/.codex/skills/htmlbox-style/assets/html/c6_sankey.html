<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 与企业合同贡献 89% 收入，云市场为增量入口</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 390px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>API 与企业合同贡献 89% 收入，云市场为增量入口</h1><p>桑基图：来源 → 交付形态 → 收入的流量结构，连线粗细即金额</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var option = {
        animation: false,
        tooltip: { trigger: "item", formatter: function (p) { return p.dataType === "edge" ? p.data.source + " → " + p.data.target + ": " + p.data.value + " 百万元" : p.name; } },
        series: [{
          type: "sankey", top: 24, bottom: 24, left: 12, right: 120, nodeGap: 14, nodeWidth: 14,
          emphasis: { focus: "adjacency" },
          lineStyle: { color: "gradient", opacity: .42, curveness: .5 },
          label: { color: "#1f2937", fontSize: 12, position: "right", formatter: function (p) { return p.value != null ? p.name + " " + p.value : p.name; } },
          data: [
            { name: "API 调用", itemStyle: { color: C.blue } },
            { name: "企业合同", itemStyle: { color: C.teal } },
            { name: "云市场", itemStyle: { color: C.amber } },
            { name: "推理服务", itemStyle: { color: "#93c5fd" } },
            { name: "训练服务", itemStyle: { color: "#5eead4" } },
            { name: "总收入", itemStyle: { color: "#1f2937" } }
          ],
          links: [
            { source: "API 调用", target: "推理服务", value: 72 },
            { source: "API 调用", target: "训练服务", value: 16 },
            { source: "企业合同", target: "推理服务", value: 36 },
            { source: "企业合同", target: "训练服务", value: 54 },
            { source: "云市场", target: "推理服务", value: 22 },
            { source: "推理服务", target: "总收入", value: 130 },
            { source: "训练服务", target: "总收入", value: 70 }
          ]
        }]
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
