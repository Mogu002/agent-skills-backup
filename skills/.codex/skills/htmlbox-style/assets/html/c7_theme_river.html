<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 主题热度持续扩张，办公主题趋于平稳</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 390px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>AI 主题热度持续扩张，办公主题趋于平稳</h1><p>主题河流图：三类主题 2026 年 1-6 月热度演化，时间粒度统一为月</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var months = ["2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06"];
      var ai = [12, 18, 26, 31, 38, 46];
      var search = [10, 14, 20, 22, 24, 25];
      var office = [8, 13, 16, 17, 17, 18];
      var data = [];
      months.forEach(function (m, i) {
        data.push([m + "-01", ai[i], "AI"]);
        data.push([m + "-01", search[i], "搜索"]);
        data.push([m + "-01", office[i], "办公"]);
      });
      var option = {
        animation: false,
        tooltip: { trigger: "axis", axisPointer: { type: "line" } },
        legend: { top: 4, itemWidth: 10, itemHeight: 10, textStyle: { color: "#4b5563", fontSize: 12 } },
        singleAxis: { top: 56, bottom: 46, type: "time", axisLabel: { color: "#4b5563", formatter: "{MM}月" }, axisLine: { lineStyle: { color: "#e5e7eb" } }, splitLine: { show: false } },
        series: [{
          type: "themeRiver", data: data,
          label: { show: false },
          itemStyle: { opacity: .85 },
          color: [C.blue, C.teal, C.amber],
          emphasis: { itemStyle: { shadowBlur: 8, shadowColor: "rgba(0,0,0,.18)" } }
        }]
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
