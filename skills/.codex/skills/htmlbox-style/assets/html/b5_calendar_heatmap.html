<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全年 3 月与 10 月是任务提交双高峰</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 300px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>全年 3 月与 10 月是任务提交双高峰</h1><p>全年日历热力图：2026 年每日任务量（次），日期区间与标题口径一致</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var year = "2026";
      var dayMs = 24 * 60 * 60 * 1000;
      var start = +new Date(year + "-01-01");
      var end = +new Date(year + "-12-31");
      var data = [];
      for (var t = start; t <= end; t += dayMs) {
        var date = echarts.format.formatTime("yyyy-MM-dd", t);
        var m = +date.slice(5, 7);
        var base = (m === 3 || m === 10) ? 62 : (m === 1 || m === 5) ? 38 : 26;
        var v = Math.max(4, Math.round(base + ((t / dayMs) % 9) * 3 + (m % 4) * 4));
        data.push([date, v]);
      }
      var option = {
        animation: false,
        tooltip: { formatter: function (p) { return p.data[0] + ": " + p.data[1] + " 次"; } },
        visualMap: { min: 0, max: 100, orient: "horizontal", left: "center", bottom: 6, textStyle: { color: "#6b7280" }, inRange: { color: ["#eff6ff", "#93c5fd", "#2563eb", "#1e3a8a"] } },
        calendar: { top: 30, left: 44, right: 26, cellSize: ["auto", 13], range: year, itemStyle: { borderWidth: 0.6, borderColor: "#ffffff" }, yearLabel: { show: true, color: "#374151", fontSize: 12 }, dayLabel: { color: "#6b7280", fontSize: 10 }, monthLabel: { color: "#6b7280", fontSize: 10 } },
        series: [{ type: "heatmap", coordinateSystem: "calendar", data: data }]
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
