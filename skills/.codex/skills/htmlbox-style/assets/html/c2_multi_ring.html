<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收入达成 82%，用户与留存仍有缺口</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #ffffff; color: #1f2937; }
  #wrap { width: 100%; padding: 14px 18px 16px; }
  .hd { padding: 2px 2px 10px; border-bottom: 1px solid #eef1f5; margin-bottom: 6px; }
  .hd h1 { margin: 0; font-size: 17px; font-weight: 650; color: #111827; letter-spacing: .2px; }
  .hd p { margin: 6px 0 0; font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  #chart { width: 100%; height: 400px; }
  #st { min-height: 20px; font-size: 13px; color: #6b7280; text-align: center; padding: 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hd"><h1>收入达成 82%，用户与留存仍有缺口</h1><p>多环进度仪表：三个同口径（%）目标达成率，不同量纲不共环</p></div>
  <div id="chart"></div>
  <div id="st" role="status">加载中...</div>
</div>
<script>
(function boot() {
  var st = document.getElementById("st") || document.getElementById("status");
  function setStatus(text) { if (st) st.textContent = text || ""; }

  if (typeof echarts === "undefined") {
    setStatus("图表库加载中...");
    return setTimeout(boot, 150);
  }

  var chart = echarts.init(document.getElementById("chart"));
  try {
      var C = { blue: "#2563eb", green: "#10b981", amber: "#f59e0b", red: "#ef4444", purple: "#8b5cf6", teal: "#14b8a6", slate: "#64748b" };

      var rings = [
        { name: "收入", value: 82, radius: ["74%", "86%"], color: C.blue },
        { name: "用户", value: 68, radius: ["58%", "70%"], color: C.teal },
        { name: "留存", value: 54, radius: ["42%", "54%"], color: C.amber }
      ];
      var option = {
        animation: false,
        title: { text: "目标达成率", left: "center", top: 2, textStyle: { fontSize: 14, fontWeight: 600, color: "#374151" } },
        tooltip: { trigger: "item", formatter: "{b}: {c}%" },
        legend: { bottom: 4, itemWidth: 10, itemHeight: 10, textStyle: { color: "#4b5563", fontSize: 12 } },
        series: rings.map(function (item) {
          return {
            name: item.name, type: "pie", radius: item.radius, center: ["50%", "50%"], silent: true,
            label: { show: false }, labelLine: { show: false },
            data: [
              { value: item.value, name: item.name, itemStyle: { color: item.color } },
              { value: 100 - item.value, name: "剩余", itemStyle: { color: "#e5e7eb" } }
            ]
          };
        }).concat([{
          type: "pie", radius: ["0%", "0%"], center: ["50%", "50%"], silent: true, label: { show: false },
          data: [{ value: 1, name: "收入 82% · 用户 68% · 留存 54%", itemStyle: { color: "transparent" } }]
        }])
      };
    chart.setOption(option, true);
    setStatus("");
  } catch (err) {
    setStatus("图表渲染失败: " + (err && err.message ? err.message : String(err)));
    console.error(err);
  }

  window.addEventListener("resize", function () { chart.resize(); });
})();
</script>
</body>
</html>
